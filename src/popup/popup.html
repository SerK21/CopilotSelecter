<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Default Model</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Copilot Default Model</h1>
        <p>固定モデルを自動選択</p>
      </header>

      <label class="field">
        <span>デフォルトモデル</span>
        <select id="modelId"></select>
      </label>

      <label class="toggle">
        <input id="enabled" type="checkbox" />
        <span>自動選択を有効化</span>
      </label>

      <div class="actions">
        <button id="save" type="button">保存</button>
        <button id="openOptions" type="button" class="secondary">詳細設定</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
