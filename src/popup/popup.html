<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Default Model</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Copilot Default Model</h1>
        <p>Work IQ のモデルを固定します</p>
      </header>

      <label class="field">
        <span>デフォルトモデル</span>
        <select id="modelId">
          <optgroup label="モード">
            <option value="smart">自動</option>
            <option value="quick">クイック応答</option>
            <option value="reasoning">Think Deeper</option>
          </optgroup>
          <optgroup label="GPT (OpenAI)">
            <option value="gpt-thinking" selected>GPT 5.6 Think Deeper</option>
            <option value="gpt-quick">GPT 5.6 Quick response</option>
            <option value="gpt-55-quick">GPT 5.5 Quick Response</option>
          </optgroup>
          <optgroup label="Claude (Anthropic)">
            <option value="sonnet">Sonnet</option>
            <option value="opus">Opus</option>
          </optgroup>
        </select>
      </label>

      <label class="toggle">
        <input id="enabled" type="checkbox" checked />
        <span>自動選択を有効化</span>
      </label>

      <div class="actions">
        <button id="save" type="button">保存して適用</button>
        <button id="applyNow" type="button" class="secondary">このタブに適用</button>
      </div>
      <div class="actions">
        <button id="openOptions" type="button" class="secondary">詳細設定</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
      <pre id="diag" class="diag" aria-live="polite"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
